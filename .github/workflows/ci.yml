name: ci

# Runs the vitest suite on every push and pull request so SEO metadata,
# link inventory, structure, and the sitemap generator stay green.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'robots.txt'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm test
